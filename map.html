<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Chọn điểm và hiển thị quãng đường</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.1.1/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.1.1/mapbox-gl.css" rel="stylesheet" />
  <style>
    body { margin:0; padding:0; }
    #map { position:absolute; top:0; bottom:0; width:100%; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    mapboxgl.accessToken = 'pk.eyJ1IjoiYmluMjcxMTAzIiwiYSI6ImNtaDNpdjQ2bjA3MWEyam9obm14MDc0OGYifQ.bBFMZ0y9I5VabvNgycE8Qg'; // ← Thay bằng token của bạn

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v12',
      center: [105.8342, 21.0278], // Hà Nội
      zoom: 12
    });

    let start = null;
    let end = null;
    let startMarker = null;
    let endMarker = null;
    let routeLayerId = 'route';

    // Hàm xóa dữ liệu cũ
    function clearOldData() {
      if (startMarker) startMarker.remove();
      if (endMarker) endMarker.remove();
      startMarker = null;
      endMarker = null;
      start = null;
      end = null;

      if (map.getLayer(routeLayerId)) {
        map.removeLayer(routeLayerId);
        map.removeSource(routeLayerId);
      }
    }

    // Khi người dùng click bản đồ
    map.on('click', async (e) => {
      const coords = [e.lngLat.lng, e.lngLat.lat];

      // Nếu đã có 2 điểm, reset trước khi thêm mới
      if (start && end) {
        clearOldData();
      }

      if (!start) {
        start = coords;
        startMarker = new mapboxgl.Marker({ color: 'green' }).setLngLat(start).addTo(map);
      } else if (!end) {
        end = coords;
        endMarker = new mapboxgl.Marker({ color: 'red' }).setLngLat(end).addTo(map);
        await drawRoute(start, end);
      }
    });

    // Hàm vẽ đường giữa 2 điểm
    async function drawRoute(start, end) {
      const query = await fetch(
        `https://api.mapbox.com/directions/v5/mapbox/driving/${start[0]},${start[1]};${end[0]},${end[1]}?steps=true&geometries=geojson&access_token=${mapboxgl.accessToken}`
      );
      const data = await query.json();
      const route = data.routes[0].geometry;

      map.addLayer({
        id: routeLayerId,
        type: 'line',
        source: {
          type: 'geojson',
          data: {
            type: 'Feature',
            properties: {},
            geometry: route
          }
        },
        layout: {
          'line-join': 'round',
          'line-cap': 'round'
        },
        paint: {
          'line-color': '#4264fb',
          'line-width': 5
        }
      });
    }
  </script>
</body>
</html>
